<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>植物工場 照明タイマー Ver.2.1</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#18212b;background:#f4f7f9}
*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:20px 28px;border-bottom:1px solid #dde4e8}
h1{font-size:24px;margin:0}.sub{font-size:14px;color:#65727e}main{max-width:1120px;margin:auto;padding:24px}
.box,.card{background:#fff;border:1px solid #dce3e7;border-radius:16px;padding:18px}.box{margin-bottom:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,select,input{font:inherit}
button{padding:10px 14px;border:1px solid #cbd5dc;border-radius:10px;background:#fff}.primary{background:#1478e8;color:#fff;border-color:#1478e8}.danger{color:#b42318}
select,.text,.num,input[type=time]{padding:9px;border:1px solid #c9d3da;border-radius:9px;background:#fff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:16px 0}.day{font-size:17px}.day.active{background:#1478e8;color:#fff;border-color:#1478e8}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card h2{margin:0 0 5px;font-size:20px}.id{font-size:12px;color:#71808c}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.row input[type=time]{font-size:18px}
input[type=checkbox]{width:24px;height:24px}.notice{min-height:24px;color:#28643f;font-weight:650;margin-top:14px}
.summary{margin-top:18px}.line{padding:9px 0;border-bottom:1px solid #edf0f2}.power{color:#53616d;font-size:13px}
@media(max-width:780px){.grid{grid-template-columns:1fr}.days{grid-template-columns:repeat(4,1fr)}.meta{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}}
</style></head>
<body><header><h1>🌱 植物工場　照明タイマー</h1><div class="sub">Ver.2.2 — 照明の追加・名称・光源仕様・定格電力</div></header>
<main>
<section class="box">
<b>保存済み栽培プログラム</b>
<div class="actions"><select id="program"></select><button id="load">呼び出す</button><button id="save" class="primary">上書き保存</button><button id="saveas">名前を付けて保存</button><button id="delprog" class="danger">プログラム削除</button></div>
<p>現在：<b id="current"></b></p>
</section>

<b>曜日を選択</b><div class="days" id="days"></div>
<div class="toolbar"><div><b>照明設定</b><div class="sub">照明は自由に追加できます。名称・光源仕様・定格電力もプログラムごとに保存します。</div></div><button id="add" class="primary">＋ 照明を追加</button></div>
<div class="grid" id="cards"></div>
<section class="box summary"><b id="sumtitle"></b><div id="summary"></div></section>
<div class="notice" id="notice"></div>
</main>
<script>
const DS=["月","火","水","木","金","土","日"];
function uid(){return "L"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function baseLights(){return [
 {id:"L01",name:"白色LED",spec:"3000K",watts:22},
 {id:"L02",name:"赤色LED",spec:"660nm",watts:22},
 {id:"L03",name:"青色LED",spec:"450nm",watts:22}
]}
function makeSchedule(lights){
 let s={};DS.forEach(d=>{s[d]={};lights.forEach((l,i)=>s[d][l.id]={on:["06:00","08:00","10:00"][i]||"06:00",off:["18:00","16:00","20:00"][i]||"18:00",enabled:true})});return s
}
function freshProgram(){let lights=baseLights();return {lights:lights,schedule:makeSchedule(lights)}}
let programs=JSON.parse(localStorage.getItem("pfProgramsV21")||"null");
if(!programs){programs={"レタス標準":freshProgram()}}
let pname=localStorage.getItem("pfCurrentV21")||Object.keys(programs)[0];if(!programs[pname])pname=Object.keys(programs)[0];
let data=JSON.parse(JSON.stringify(programs[pname])), day=0;
function persist(){localStorage.setItem("pfProgramsV21",JSON.stringify(programs));localStorage.setItem("pfCurrentV21",pname)}
function msg(x){document.getElementById("notice").textContent=x}
function ensureDay(light){
 DS.forEach(d=>{if(!data.schedule[d])data.schedule[d]={};if(!data.schedule[d][light.id])data.schedule[d][light.id]={on:"06:00",off:"18:00",enabled:true}})
}
function renderPrograms(){
 let p=document.getElementById("program");p.innerHTML="";
 Object.keys(programs).forEach(n=>{let o=document.createElement("option");o.value=n;o.textContent=n;o.selected=n===pname;p.appendChild(o)});
 document.getElementById("current").textContent=pname
}
function renderDays(){
 let e=document.getElementById("days");e.innerHTML="";
 DS.forEach((d,i)=>{let b=document.createElement("button");b.className="day"+(i===day?" active":"");b.textContent=d;b.onclick=()=>{day=i;render()};e.appendChild(b)})
}
function normalize(){data.lights.forEach(l=>{if(l.spec===undefined){l.spec=l.wavelength!==undefined?(String(l.wavelength)+(String(l.wavelength).includes("nm")?"":"nm")):""}})}
function renderCards(){normalize();
 let e=document.getElementById("cards");e.innerHTML="";
 data.lights.forEach((l,idx)=>{
  ensureDay(l);let v=data.schedule[DS[day]][l.id],c=document.createElement("div");c.className="card";
  c.innerHTML=`<h2>${escapeHtml(l.name||"名称未設定")}</h2><div class=id>照明ID：${l.id}</div>
  <div class=meta>
   <div class=field><label>照明名</label><input class=text data-meta=name value="${escapeAttr(l.name)}" placeholder="例：遠赤色LED"></div>
   <div class=field><label>光源仕様</label><input class=text data-meta=spec value="${escapeAttr(l.spec||"")}" placeholder="例：3000K / 660nm / R:B=3:1"></div>
   <div class=field><label>定格電力 (W)</label><input class=num data-meta=watts type=number min=0 step=0.1 value="${escapeAttr(l.watts)}"></div>
  </div>
  <div class=row><b>使用する</b><input data-time=enabled type=checkbox ${v.enabled?"checked":""}></div>
  <div class=row><b>ON 時刻</b><input data-time=on type=time value="${v.on}"></div>
  <div class=row><b>OFF 時刻</b><input data-time=off type=time value="${v.off}"></div>
  <div class=actions><button class=danger data-delete="${l.id}">この照明を削除</button></div>`;
  c.querySelectorAll("[data-meta]").forEach(inp=>inp.onchange=()=>{
    let k=inp.dataset.meta;l[k]=k==="watts"?(parseFloat(inp.value)||0):inp.value;render();msg("照明情報を変更しました。上書き保存してください。")
  });
  c.querySelectorAll("[data-time]").forEach(inp=>inp.onchange=()=>{
    let k=inp.dataset.time;v[k]=k==="enabled"?inp.checked:inp.value;renderSummary();msg("時刻設定を変更しました。上書き保存してください。")
  });
  c.querySelector("[data-delete]").onclick=()=>deleteLight(l.id);
  e.appendChild(c)
 })
}
function renderSummary(){normalize();
 document.getElementById("sumtitle").textContent=DS[day]+"曜日の設定";
 document.getElementById("summary").innerHTML=data.lights.map(l=>{let v=data.schedule[DS[day]][l.id];let wh=calcWh(v,l.watts);return `<div class=line><b>${escapeHtml(l.name)}</b> <span class=power>${l.spec?escapeHtml(l.spec)+" / ":""}${l.watts||0} W</span><br>ON ${v.on} ／ OFF ${v.off}　${v.enabled?"● 有効":"○ 無効"}　<span class=power>予定 ${wh.toFixed(1)} Wh/日</span></div>`}).join("")
}
function calcWh(v,w){if(!v.enabled)return 0;let a=v.on.split(":").map(Number),b=v.off.split(":").map(Number),m=(b[0]*60+b[1])-(a[0]*60+a[1]);if(m<0)m+=1440;return (Number(w)||0)*m/60}
function addLight(){
 let l={id:uid(),name:"新しい照明",spec:"",watts:0};data.lights.push(l);ensureDay(l);render();msg("照明を追加しました。名称・光源仕様・定格電力を入力してください。")
}
function deleteLight(id){
 if(data.lights.length<=1)return alert("照明は最低1つ必要です。");
 let l=data.lights.find(x=>x.id===id);if(!confirm("「"+l.name+"」を削除しますか？"))return;
 data.lights=data.lights.filter(x=>x.id!==id);DS.forEach(d=>delete data.schedule[d][id]);render();msg("照明を削除しました。上書き保存してください。")
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escapeAttr(s){return escapeHtml(s)}
function render(){renderPrograms();renderDays();renderCards();renderSummary()}
document.getElementById("add").onclick=addLight;
document.getElementById("load").onclick=()=>{pname=document.getElementById("program").value;data=JSON.parse(JSON.stringify(programs[pname]));persist();render();msg("✓ 「"+pname+"」を呼び出しました。")};
document.getElementById("save").onclick=()=>{programs[pname]=JSON.parse(JSON.stringify(data));persist();render();msg("✓ 「"+pname+"」を上書き保存しました。")};
document.getElementById("saveas").onclick=()=>{let n=prompt("新しいプログラム名を入力してください");if(!n)return;n=n.trim();if(!n)return;if(programs[n]&&!confirm("同じ名前があります。上書きしますか？"))return;programs[n]=JSON.parse(JSON.stringify(data));pname=n;persist();render();msg("✓ 「"+n+"」として保存しました。")};
document.getElementById("delprog").onclick=()=>{if(Object.keys(programs).length<2)return alert("最後の1件は削除できません。");if(!confirm("「"+pname+"」を削除しますか？"))return;delete programs[pname];pname=Object.keys(programs)[0];data=JSON.parse(JSON.stringify(programs[pname]));persist();render();msg("✓ プログラムを削除しました。")};
persist();render();
</script></body></html>
